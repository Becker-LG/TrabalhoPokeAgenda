{% extends "base.html" %}

{% block content %}
          <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Dashboard</h1>
          </div>
          <h2>Treinadores Cadastrados</h2>
          <div class="table-responsive small">
            <table class="table table-striped table-sm">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Nome</th>
                  <th scope="col">E-mail</th>
                  <th scope="col">Cidade</th>
                  <th scope="col">Foto</th>
                </tr>
              </thead>
              <tbody>
                {% for treinador in treinadores %}
                <tr style="vertical-align: middle; text-align: center;">
                  <td>{{ treinador.id }}</td>
                  <td>{{ treinador.nome }}</td>
                  <td>{{ treinador.email }}</td>
                  <td>{{ treinador.cidade }}</td>
                  <td><img src="{{ treinador.foto if (treinador.foto != '') else ('https://via.placeholder.com/300x400.png?text=Sem+Imagem') }}" class="card-img-top" alt="Imagem do Treinador {{ treinador.nome }}" style="height: 320px; object-fit: cover;"></td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
{% endblock %}
